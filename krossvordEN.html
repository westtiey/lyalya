<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Year Crossword</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8ff;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #d42426;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .crossword-container {
            display: inline-block;
            margin: 20px auto;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .crossword-grid {
            display: grid;
            grid-template-columns: repeat(12, 30px);
            grid-gap: 1px;
            margin: 0 auto;
        }
        .cell {
            width: 30px;
            height: 30px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            background-color: #fff;
            color: #000;
        }
        .black {
            background-color: #333;
        }
        .word-list {
            margin-top: 20px;
            text-align: left;
            display: inline-block;
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .word-list h2 {
            color: #2e8b57;
        }
        .word-list ul {
            list-style-type: none;
            padding: 0;
        }
        .word-list li {
            margin: 8px 0;
        }
        footer {
            margin-top: 20px;
            color: #555;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <h1>🎄 New Year Crossword 🎄</h1>

    <div class="crossword-container">
        <div class="crossword-grid" id="grid">
            <!-- Grid will be filled by JavaScript -->
        </div>
    </div>

    <div class="word-list">
        <h2>Words to Find:</h2>
        <ul>
            <li>1. Ornaments</li>
            <li>2. Santa</li>
            <li>3. Candy</li>
            <li>4. Cookies</li>
            <li>5. Holly</li>
            <li>6. Carols</li>
            <li>7. Fireworks</li>
            <li>8. Midnight</li>
            <li>9. Christmas</li>
            <li>10. Elf</li>
        </ul>
    </div>

    <footer>
        Happy Holidays! ✨
    </footer>

    <script>
        // Words list (note: corrected "Firewors" → "Fireworks", "Carrols" → "Carols")
        const words = [
            { word: "ORNAMENTS", direction: "across", row: 0, col: 1 },
            { word: "SANTA", direction: "down", row: 0, col: 3 },
            { word: "CANDY", direction: "down", row: 0, col: 6 },
            { word: "COOKIES", direction: "across", row: 2, col: 4 },
            { word: "HOLLY", direction: "down", row: 1, col: 10 },
            { word: "CAROLS", direction: "across", row: 5, col: 1 },
            { word: "FIREWORKS", direction: "across", row: 7, col: 0 },
            { word: "MIDNIGHT", direction: "down", row: 0, col: 8 },
            { word: "CHRISTMAS", direction: "across", row: 10, col: 1 },
            { word: "ELF", direction: "down", row: 8, col: 5 }
        ];

        const rows = 12;
        const cols = 12;
        const grid = Array(rows).fill().map(() => Array(cols).fill(null));

        // Place words into grid
        words.forEach(item => {
            const { word, direction, row, col } = item;
            if (direction === "across") {
                for (let i = 0; i < word.length; i++) {
                    if (col + i < cols) {
                        grid[row][col + i] = word[i];
                    }
                }
            } else if (direction === "down") {
                for (let i = 0; i < word.length; i++) {
                    if (row + i < rows) {
                        grid[row + i][col] = word[i];
                    }
                }
            }
        });

        // Render grid
        const gridElement = document.getElementById("grid");
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const cell = document.createElement("div");
                cell.className = "cell";
                if (grid[r][c] === null) {
                    cell.classList.add("black");
                } else {
                    cell.textContent = grid[r][c];
                }
                gridElement.appendChild(cell);
            }
        }
    </script>
</body>
</html>
